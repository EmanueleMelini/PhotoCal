<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoCal</title>
  <style>
    :root { color-scheme: light dark; --bg: #fdfdf6; --fg: #1a1c18; --muted: #43483f; --accent: #386a20; --card: #f1f1ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1c18; --fg: #e3e3dc; --muted: #c3c8bb; --accent: #9cd67d; --card: #282b26; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 3rem 1rem; }
    .card { background: var(--card); border-radius: 16px; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; color: var(--accent); }
    p { margin: .5rem 0; }
    .muted { color: var(--muted); font-size: .9rem; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--muted); opacity: .3; margin: 1.5rem 0; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>PhotoCal</h1>
    <p>App Android personale per contare le calorie: diario, foto dei pasti, acqua e obiettivi.</p>
    <p><a href="https://github.com/EmanueleMelini/PhotoCal">Codice e download su GitHub</a></p>
  </div>
</main>
</body>
</html>
