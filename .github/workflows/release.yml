# Builds the signed release APK for every version tag (v1.0.0, v1.1.0, ...) and publishes it
# as a downloadable asset of a GitHub Release for that tag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Workload Identity Federation: GitHub's OIDC token, exchanged for a Google one to send the push
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java 25 matches the Gradle daemon toolchain (gradle/gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Same English text the app shows after the update (values-en changelog_x_y_z):
      # checked before the build, so a missing changelog stops the release early
      - name: Write the release notes from the app changelog
        run: python3 .github/scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOCAL_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/photocal-release.jks"

      # Firebase configuration, kept out of the public repository
      - name: Restore the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.PHOTOCAL_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build the signed APK
        env:
          PHOTOCAL_KEYSTORE_PATH: ${{ runner.temp }}/photocal-release.jks
          PHOTOCAL_KEYSTORE_PASSWORD: ${{ secrets.PHOTOCAL_KEYSTORE_PASSWORD }}
          PHOTOCAL_KEY_ALIAS: ${{ secrets.PHOTOCAL_KEY_ALIAS }}
          PHOTOCAL_SHARE_KEY: ${{ secrets.PHOTOCAL_SHARE_KEY }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PhotoCal-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "PhotoCal $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      # Push notification to the app users, in their language. "[no-push]" in the tag message
      # (git tag -a vX.Y.Z -m "PhotoCal X.Y.Z [no-push]") skips it, e.g. for a small fix.
      # actions/checkout keeps only the commit: the annotated tag is fetched to read its message.
      - name: Check whether to announce the release
        id: announce
        run: |
          git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -qF '[no-push]'; then
            echo "The tag message has [no-push]: no notification"
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.announce.outputs.send == 'true'
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PHOTOCAL_WIF_PROVIDER }}
          service_account: ${{ vars.PHOTOCAL_FCM_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Announce the new version
        if: steps.announce.outputs.send == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PHOTOCAL_FIREBASE_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 .github/scripts/notify_update.py "$VERSION"
